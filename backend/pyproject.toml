[project]
name = "exam-attendance-backend"
version = "0.1.0"
description = "Backend for the AI-powered examination attendance system"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "numpy>=2.4.6",
]

[project.optional-dependencies]
vision = [
    "insightface>=2.1,<3",
    "onnxruntime>=1.18",
    "supervision>=0.25,<0.26",
]
# For a hosted database such as Supabase Postgres. Use a URL like
# postgresql+psycopg://USER:PASSWORD@HOST:5432/postgres
postgres = [
    "psycopg[binary]>=3.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
